apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudbeaver-route
  namespace: db
spec:
  parentRefs:
    - name: local-gateway
      namespace: nginx-gateway
  hostnames:
    - beaver.local
  rules:
    - backendRefs:
        - name: cloudbeaver
          namespace: db
          port: 8978