replicaCount: 1
yamlApplicationConfig:
  webclient:
    max-in-memory-buffer-size: 20MB
  kafka:
    clusters:
      - name: my-kafka
        bootstrapServers: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
        kafka-connect:
          - name: my-connect-cluster
            address: http://my-connect-cluster-connect-api.kafka.svc.cluster.local:8083
resources:
  limits:
    cpu: 2
    memory: 1Gi
  requests:
    cpu: 1
    memory: 1Gi
