# Disable the built-in Kafka (since you likely have one already)
kafka:
  enabled: false
image:
  tag: latest
#  registry: docker.io
#  repository: bitnami/schema-registry
#  tag: latest
# Configure the connection to your existing Kafka
externalKafka:
  brokers:
    - "my-cluster-kafka-bootstrap:9092"

# Schema Registry specific settings
configurationOverrides:
  # The topic where schemas are stored
  kafkastore.topic: "_schemas"
  # Compatibility level (optional: BACKWARD, FORWARD, FULL, NONE)
  schema.compatibility.level: "BACKWARD"

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

# Expose the Registry
service:
  type: ClusterIP
  ports:
    http: 8081